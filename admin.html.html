<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pasabuy Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf4f0;--card:#fff;--ink:#5a3e38;--muted:#8f6f67;--acc:#e89bb0;--acc-deep:#a4566e;--line:#f0d5cc;--tint:#fbe5e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 "Nunito",system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:28px 18px 80px}
h1,h2,h3{font-family:"Quicksand","Nunito",sans-serif;color:var(--acc-deep);margin:0 0 10px}
h1{font-size:30px} h2{font-size:20px} h3{font-size:17px;color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:600 16px "Nunito",sans-serif;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
textarea{min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--acc);color:#4a2a2f;border:0;border-radius:14px;font:800 16px "Nunito",sans-serif;padding:12px 16px;cursor:pointer;margin-top:10px}
.btn.ghost{background:#fff;color:var(--acc-deep);border:2px solid var(--line)}
.btn.small{padding:7px 11px;font-size:14px;margin-top:0}
.row{border:1px dashed var(--line);border-radius:14px;padding:10px;margin-top:8px;background:#fffafb}
.err{color:var(--acc-deep);font-weight:800;min-height:22px}
.list button{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font:700 16px "Nunito",sans-serif;color:var(--ink);cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const SUPABASE_URL = "https://bhvrvlykrxaxryiktnoa.supabase.co";
const SUPABASE_KEY = "sb_publishable_Qwibu4XpIyeIymhBURX8zg_-ry0J460";
const STAGES = ["Reserved","Down payment received","Item secured","Packed for travel","Arrived in the Philippines","Ready for pickup or delivery","Completed"];
const STATUSES = ["Auto","Paid","Partly paid","Not yet paid","Pending"];
let TOKEN = null, ORDERS = [], CURRENT = null;
const app = document.getElementById("app");

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function opts(list, sel){ return list.map((v,k) => '<option value="' + k + '"' + (k == sel ? ' selected' : '') + '>' + esc(v) + '</option>').join(''); }
function statusOpts(sel){ return STATUSES.map(s => '<option' + (s === (sel || "Auto") ? ' selected' : '') + '>' + s + '</option>').join(''); }
function today(){ return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

async function sha256Hex(text){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("");
}

function headers(){ return { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + (TOKEN || SUPABASE_KEY), "Content-Type": "application/json" }; }

async function signIn(){
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value;
  const el = document.getElementById("err"); el.textContent = "Signing in…";
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST", headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password: pass })
  });
  const j = await res.json();
  if (!res.ok || !j.access_token) { el.textContent = "Sign-in failed. Check your email and password."; return; }
  TOKEN = j.access_token; loadList();
}

function loginScreen(){
  app.innerHTML = '<div class="card"><h1>Pasabuy admin</h1><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="pass" type="password" autocomplete="current-password"><p class="err" id="err"></p><button class="btn" onclick="signIn()">Sign in</button></div>';
}

async function loadList(){
  const res = await fetch(SUPABASE_URL + "/rest/v1/orders?select=*&order=buyer_name.asc", { headers: headers() });
  if (!res.ok) { loginScreen(); document.getElementById("err").textContent = "Couldn’t load orders. Sign in again."; return; }
  ORDERS = await res.json();
  app.innerHTML = '<div class="top"><h1>Buyers</h1><button class="btn small" onclick="newOrder()">+ Add buyer</button></div>' +
    '<div class="list">' + ORDERS.map((o,k) => '<button onclick="editOrder(' + k + ')">' + esc(o.buyer_name) + '<br><span style="font-weight:600;color:var(--muted);font-size:13px">' + esc(o.size || "") + ' · ' + esc(o.where_to_buy || "") + '</span></button>').join('') + '</div>' +
    '<button class="btn ghost" onclick="loginScreen()">Sign out</button>';
}

function newOrder(){ CURRENT = null; renderForm({ buyer_name:"", size:"", colors:[], stamping:"", where_to_buy:"", buyer_note:"", items:[], payment_plan:{installments:[],notes:[]}, perks:"None", shipping:"TBA" }, true); }
function editOrder(k){ CURRENT = ORDERS[k]; renderForm(CURRENT, false); }

function itemRow(i, n){
  return '<div class="row item-row"><div class="grid2"><div><label>Item name</label><input class="i_name" value="' + esc(i.name) + '"></div>' +
    '<div><label>Price (₱)</label><input class="i_price" type="number" value="' + (i.price || 0) + '"></div></div>' +
    '<div class="grid2"><div><label>Paid so far (₱)</label><input class="i_paid" type="number" value="' + (i.paid || 0) + '"></div>' +
    '<div><label>Payment status</label><select class="i_status">' + statusOpts(i.status) + '</select></div></div>' +
    '<div class="grid2"><div><label>Progress stage</label><select class="i_stage">' + opts(STAGES, i.stage || 0) + '</select></div>' +
    '<div><label>Add-on (no progress steps)?</label><select class="i_addon"><option value="0"' + (i.addon ? '' : ' selected') + '>No</option><option value="1"' + (i.addon ? ' selected' : '') + '>Yes</option></select></div></div>' +
    '<button class="btn small ghost" style="margin-top:8px" onclick="this.closest(\'.item-row\').remove()">Remove item</button></div>';
}
function instRow(p){
  return '<div class="row inst-row"><div class="grid2"><div><label>Label</label><input class="p_label" value="' + esc(p.label) + '"></div>' +
    '<div><label>Due</label><input class="p_due" value="' + esc(p.due) + '"></div></div>' +
    '<div class="grid2"><div><label>Amount (₱)</label><input class="p_amount" type="number" value="' + (p.amount || 0) + '"></div>' +
    '<div><label>Paid so far (₱)</label><input class="p_paid" type="number" value="' + (p.paid || 0) + '"></div></div>' +
    '<label>Status</label><select class="p_status">' + statusOpts(p.status) + '</select>' +
    '<button class="btn small ghost" style="margin-top:8px" onclick="this.closest(\'.inst-row\').remove()">Remove</button></div>';
}

function renderForm(o, isNew){
  const plan = o.payment_plan || {};
  app.innerHTML =
    '<div class="top"><button class="btn small ghost" onclick="loadList()">← Back</button><h2>' + (isNew ? 'New buyer' : esc(o.buyer_name)) + '</h2></div>' +
    '<div class="card"><h3>Buyer</h3>' +
    '<label>Full name</label><input id="f_name" value="' + esc(o.buyer_name) + '">' +
    (isNew ? '<label>Access code (10 characters, no dashes needed)</label><input id="f_code" style="text-transform:uppercase">' : '') +
    '<div class="grid2"><div><label>Size</label><input id="f_size" value="' + esc(o.size) + '"></div>' +
    '<div><label>Where I’ll buy</label><input id="f_where" value="' + esc(o.where_to_buy) + '"></div></div>' +
    '<label>Stamping</label><input id="f_stamp" value="' + esc(o.stamping) + '">' +
    '<label>Color choices (one per line, first = 1st choice)</label><textarea id="f_colors">' + esc((o.colors || []).join('\n')) + '</textarea>' +
    '<label>Note from buyer</label><textarea id="f_note">' + esc(o.buyer_note) + '</textarea></div>' +
    '<div class="card"><h3>Items</h3><div id="items">' + (o.items || []).map(itemRow).join('') + '</div>' +
    '<button class="btn small ghost" onclick="document.getElementById(\'items\').insertAdjacentHTML(\'beforeend\',itemRow({name:\'\',price:0,paid:0,stage:0},0))">+ Add item</button></div>' +
    '<div class="card"><h3>Payment plan</h3><label>Payment due (main date)</label><input id="f_due" value="' + esc(plan.due) + '">' +
    '<div id="inst">' + (plan.installments || []).map(instRow).join('') + '</div>' +
    '<button class="btn small ghost" onclick="document.getElementById(\'inst\').insertAdjacentHTML(\'beforeend\',instRow({label:\'\',due:\'\',amount:0,paid:0}))">+ Add installment</button>' +
    '<label>Notes (one per line)</label><textarea id="f_notes">' + esc((plan.notes || []).join('\n')) + '</textarea></div>' +
    '<div class="card"><h3>Perks and shipping</h3><div class="grid2"><div><label>Perks</label><input id="f_perks" value="' + esc(o.perks) + '"></div>' +
    '<div><label>Shipping</label><input id="f_ship" value="' + esc(o.shipping) + '"></div></div></div>' +
    '<p class="err" id="err"></p><button class="btn" onclick="save(' + isNew + ')">Save</button>';
}

function readForm(){
  const items = [...document.querySelectorAll('.item-row')].map(r => {
    const st = r.querySelector('.i_status').value;
    const item = { name: r.querySelector('.i_name').value, price: Number(r.querySelector('.i_price').value) || 0, qty: 1,
      paid: Number(r.querySelector('.i_paid').value) || 0, stage: Number(r.querySelector('.i_stage').value) || 0,
      updated: today(), addon: r.querySelector('.i_addon').value === "1" };
    if (st !== "Auto") item.status = st;
    return item;
  });
  const installments = [...document.querySelectorAll('.inst-row')].map(r => {
    const st = r.querySelector('.p_status').value;
    const p = { label: r.querySelector('.p_label').value, due: r.querySelector('.p_due').value,
      amount: Number(r.querySelector('.p_amount').value) || 0, paid: Number(r.querySelector('.p_paid').value) || 0 };
    if (st !== "Auto") p.status = st;
    return p;
  });
  return {
    buyer_name: document.getElementById("f_name").value.trim(),
    size: document.getElementById("f_size") ? document.getElementById("f_size").value.trim() : (CURRENT ? CURRENT.size : ""),
    where_to_buy: document.getElementById("f_where") ? document.getElementById("f_where").value.trim() : (CURRENT ? CURRENT.where_to_buy : ""),
    stamping: document.getElementById("f_stamp").value.trim(),
    colors: document.getElementById("f_colors").value.split('\n').map(s => s.trim()).filter(Boolean),
    buyer_note: document.getElementById("f_note").value.trim(),
    items: items,
    payment_plan: { due: document.getElementById("f_due").value.trim(), installments: installments,
      notes: document.getElementById("f_notes").value.split('\n').map(s => s.trim()).filter(Boolean) },
    perks: document.getElementById("f_perks").value.trim() || "None",
    shipping: document.getElementById("f_ship").value.trim() || "TBA",
    updated_at: new Date().toISOString()
  };
}

async function save(isNew){
  const el = document.getElementById("err"); el.textContent = "Saving…";
  const body = readForm();
  if (!body.buyer_name) { el.textContent = "Enter the buyer’s name."; return; }
  let res;
  if (isNew) {
    const code = (document.getElementById("f_code").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length < 10) { el.textContent = "Enter a 10-character access code."; return; }
    body.access_code_hash = await sha256Hex(code);
    res = await fetch(SUPABASE_URL + "/rest/v1/orders", { method: "POST", headers: Object.assign({}, headers(), { "Prefer": "return=minimal" }), body: JSON.stringify(body) });
  } else {
    res = await fetch(SUPABASE_URL + "/rest/v1/orders?id=eq." + CURRENT.id, { method: "PATCH", headers: Object.assign({}, headers(), { "Prefer": "return=minimal" }), body: JSON.stringify(body) });
  }
  if (!res.ok) { el.textContent = "Couldn’t save. Check the code isn’t already used, then try again."; return; }
  await loadList();
}

loginScreen();
</script>
</body>
</html>
