<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cakelin’s Longchamp Pasabuy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf4f0;--card:#ffffff;--ink:#5a3e38;--muted:#8f6f67;--acc:#e89bb0;--acc-deep:#a4566e;--ok:#d9a3b5;--line:#f0d5cc;--tint:#fbe5e9;color-scheme:light;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.55 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:36px 20px 64px}
h1,h2,h3,.lbl{font-family:"Quicksand","Nunito",system-ui,sans-serif;font-weight:700;line-height:1.2;margin:0 0 10px;color:var(--acc-deep)}
h1{font-size:clamp(30px,8vw,40px)} h2{font-size:19px;color:var(--ink);margin-bottom:8px} h3{font-size:19px;margin-bottom:6px;color:var(--ink)}
p{margin:0 0 12px}.muted{color:var(--muted)}
.lbl{font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin:4px 0}
input{width:100%;font:700 19px "Nunito",system-ui,sans-serif;letter-spacing:.08em;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px;text-transform:uppercase}
.btn{display:block;width:100%;background:var(--acc);color:#4a2a2f;border:0;border-radius:18px;font:800 17px "Nunito",system-ui,sans-serif;padding:14px 20px;min-height:50px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 4px 0 #cf8197}
.btn.alt{background:var(--card);color:var(--acc-deep);border:2px solid var(--line);box-shadow:none;margin-top:12px}
.back{background:none;border:0;color:var(--muted);font:700 15px "Nunito",sans-serif;padding:12px 0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.err{color:var(--acc-deep);font-weight:800;min-height:22px;margin:0 0 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.two .card{margin-bottom:0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.sum div{background:var(--tint);border-radius:18px;padding:10px 6px;text-align:center}
.sum span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.sum b{font-size:17px;font-family:"Quicksand",sans-serif}
.line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.line:first-of-type{border-top:0}
.line small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.line b{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;margin-top:3px}
.tag.paid{background:#dff0e4;color:#3d7a53}
.tag.partly{background:#fdf0cf;color:#8a6312}
.tag.not{background:var(--tint);color:var(--acc-deep)}
.note{background:var(--tint);border-radius:14px;padding:10px 14px;margin:10px 0 0;font-weight:700;font-size:15px;color:var(--ink)}
.choices{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.choices li{background:var(--tint);border-radius:14px;padding:7px 12px;font-weight:700;font-size:15px}
.choices span{color:var(--acc-deep);font-size:13px;margin-right:6px}
.st{list-style:none;margin:0;padding:0}
.st li{position:relative;padding:5px 0 5px 30px;color:var(--muted);font-size:15px;font-weight:600}
.st li::before{content:"";position:absolute;left:0;top:10px;width:17px;height:17px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.st li.done{color:var(--ink)} .st li.done::before{background:var(--ok);border-color:var(--ok)}
.st li.cur{color:var(--acc-deep);font-weight:800} .st li.cur::before{border-color:var(--acc-deep);background:var(--acc)}
@media (max-width:420px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* Connected to your Supabase project. Only buyers' own orders are returned. */
const SUPABASE_URL = "https://bhvrvlykrxaxryiktnoa.supabase.co";
const SUPABASE_KEY = "sb_publishable_Qwibu4XpIyeIymhBURX8zg_-ry0J460";

const MSG = "https://www.facebook.com/share/1CCPXzw6fN/?mibextid=wwXIfr";
const STAGES = ["Reserved","Down payment received","Item secured","Packed for travel","Arrived in the Philippines","Ready for pickup or delivery","Completed"];

const app = document.getElementById("app");

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function php(n){ return "₱" + Number(n || 0).toLocaleString("en-PH"); }

// Status shown for each payment: Paid, Partly paid, Not yet paid (or a status you set)
function statusOf(item){
  if (item.status) return item.status;
  const amount = (item.price || 0) * (item.qty || 1);
  if ((item.paid || 0) >= amount && amount > 0) return "Paid";
  if ((item.paid || 0) > 0) return "Partly paid";
  return "Not yet paid";
}
function tagClass(s){ return s === "Paid" ? "paid" : (s === "Partly paid" ? "partly" : "not"); }
function tag(s){ return '<span class="tag ' + tagClass(s) + '">' + esc(s) + '</span>'; }

async function fetchOrder(code){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_my_order", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_code: code })
  });
  if (!res.ok) throw new Error("Server error");
  return await res.json();
}

function loginScreen(message){
  window.scrollTo(0,0);
  app.innerHTML =
    '<p class="lbl">Track your order</p>' +
    '<h1>Cakelin’s Longchamp Pasabuy</h1>' +
    '<input type="text" id="code" placeholder="Access code" autocapitalize="characters" autocomplete="off">' +
    '<p class="err" id="err">' + esc(message || "") + '</p>' +
    '<button class="btn" onclick="lookup()">View my order</button>' +
    '<p class="muted" style="font-size:14px;margin-top:16px">No code yet? Message me and I’ll send one once your order is reserved.</p>' +
    '<a class="btn alt" href="' + MSG + '">Message me</a>';
}

async function lookup(){
  const el = document.getElementById("err");
  const code = (document.getElementById("code").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length < 10) { el.textContent = "Enter your 10-character access code."; return; }
  el.textContent = "Checking…";
  try {
    const order = await fetchOrder(code);
    if (!order) { loginScreen("That code doesn’t match. Check it and try again."); return; }
    showOrder(order);
  } catch (e) {
    loginScreen("Couldn’t open that code. Check your connection and try again.");
  }
}

function showOrder(o){
  window.scrollTo(0,0);
  const items = (o.items || []).filter(i => !i.addon);
  const addons = (o.items || []).filter(i => i.addon);
  const all = o.items || [];

  let total = 0, paid = 0;
  all.forEach(i => { total += (i.price || 0) * (i.qty || 1); paid += i.paid || 0; });

  // Payment plan (top of page)
  const plan = o.payment_plan || {};
  const installments = (plan.installments || []).map(p => {
    const s = p.paid >= p.amount && p.amount > 0 ? "Paid" : (p.paid > 0 ? "Partly paid" : "Not yet paid");
    return '<div class="line"><div>' + esc(p.label) + '<small>Due ' + esc(p.due) + '</small></div><div><b>' + php(p.amount) + '</b><br>' + tag(p.status || s) + '</div></div>';
  }).join('');
  const planNotes = (plan.notes || []).map(n => '<p class="note">' + esc(n) + '</p>').join('');
  const planCard = '<div class="card"><h2>Payment plan</h2>' +
    (plan.due ? '<p class="muted" style="margin:0 0 6px;font-size:14px">Payment due: ' + esc(plan.due) + '</p>' : '') +
    installments + planNotes + '</div>';

  // Price breakdown (left) and perks/shipping (right)
  const breakdown = all.map(i => {
    const amount = (i.price || 0) * (i.qty || 1);
    return '<div class="line"><div>' + esc(i.name) + '<br>' + tag(statusOf(i)) + '</div><b>' + php(amount) + '</b></div>';
  }).join('');
  const breakdownCard = '<div class="card"><h2>Price breakdown</h2>' + breakdown +
    '<div class="line"><div><b>Total</b></div><b>' + php(total) + '</b></div></div>';

  const perksCard = '<div class="card"><h2>Perks</h2><p style="margin:0 0 12px">' + esc(o.perks || "None") + '</p>' +
    '<h2>Shipping</h2><p style="margin:0">' + esc(o.shipping || "TBA") + '</p></div>';

  // Color choices and where to buy (kept from your order)
  const colors = (o.colors || []).length
    ? '<p class="lbl" style="font-size:13px">Color choices</p><ol class="choices">' +
      o.colors.map((c, k) => '<li><span>' + ["1st","2nd","3rd","4th"][k] + ' choice</span>' + esc(c) + '</li>').join('') + '</ol>'
    : '';
  const choiceCard = '<div class="card"><h2>Your choices</h2>' +
    '<div class="line"><span>Size</span><b>' + esc(o.size || "-") + '</b></div>' +
    '<div class="line"><span>Where I’ll buy</span><b>' + esc(o.where_to_buy || "-") + '</b></div>' +
    '<div class="line"><span>Stamping</span><b>' + esc(o.stamping || "None") + '</b></div>' +
    colors +
    (o.buyer_note ? '<p class="note"><b>Note from buyer:</b> ' + esc(o.buyer_note) + '</p>' : '') + '</div>';

  // Items with progress
  const itemCards = items.map(i => {
    const steps = STAGES.map((s, k) => '<li class="' + (k < i.stage ? 'done' : (k == i.stage ? 'cur' : '')) + '">' + s + '</li>').join('');
    return '<div class="card"><h3>' + esc(i.name) + '</h3>' +
      '<p class="muted" style="margin:0 0 8px">' + php((i.price || 0) * (i.qty || 1)) + ' · ' + tag(statusOf(i)) + '</p>' +
      '<ol class="st">' + steps + '</ol>' +
      '<p class="muted" style="font-size:13px;margin:8px 0 0">Updated ' + esc(i.updated || "") + '</p></div>';
  }).join('');

  const addonCards = addons.map(i =>
    '<div class="card"><p class="lbl" style="margin:0 0 4px">Add-on</p><h3>' + esc(i.name) + '</h3>' +
    '<p class="muted" style="margin:0">' + php((i.price || 0) * (i.qty || 1)) + ' · ' + tag(statusOf(i)) + '</p>' +
    '<p class="muted" style="font-size:13px;margin:8px 0 0">Updated ' + esc(i.updated || "") + '</p></div>'
  ).join('');

  app.innerHTML =
    '<p class="lbl">Cakelin’s Longchamp Pasabuy</p>' +
    '<h1>Hi, ' + esc(o.buyer_name) + '</h1>' +
    '<div class="sum"><div><span>Total</span><b>' + php(total) + '</b></div><div><span>Paid</span><b>' + php(paid) + '</b></div><div><span>Balance</span><b>' + php(total - paid) + '</b></div></div>' +
    planCard +
    '<div class="two">' + breakdownCard + perksCard + '</div>' +
    choiceCard +
    itemCards + addonCards +
    '<a class="btn alt" href="' + MSG + '">Message me</a>' +
    '<button class="back" onclick="loginScreen()">Log out</button>';
}

loginScreen();
</script>
</body>
</html>
